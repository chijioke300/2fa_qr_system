<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card wide">
        <div class="row">
            <h1>Welcome, {{ user }}</h1>
            <a class="link" href="{{ url_for('logout') }}">Log out</a>
        </div>
        <div class="alert success">You are authenticated with two factors (password + scanned QR).</div>

        <h2>Authentication log</h2>
        <table class="log-table">
            <thead>
                <tr><th>Time</th><th>User</th><th>Event</th><th>Detail</th></tr>
            </thead>
            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log['created_at'] }}</td>
                    <td>{{ log['username'] or '&mdash;' | safe }}</td>
                    <td>{{ log['event'] }}</td>
                    <td>{{ log['detail'] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
